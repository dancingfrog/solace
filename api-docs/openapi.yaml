openapi: 3.1.0
info:
  title: Solace Advocates API
  version: 1.0.0
  description: API for managing advocates in the Solace mental health platform

servers:
  - url: http://localhost:3000/api
    description: Local development server

paths:
  /advocates:
    get:
      summary: Retrieve advocates
      description: Returns a list of all advocates in the database
      operationId: getAdvocates
      responses:
        '200':
          description: A list of advocates
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Advocate'
        '500':
          description: Server error

  /seed:
    post:
      summary: Seed the database
      description: Populates the database with initial advocate data
      operationId: seedDatabase
      responses:
        '200':
          description: Database successfully seeded
          content:
            application/json:
              schema:
                type: object
                properties:
                  advocates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Advocate'
        '500':
          description: Server error

components:
  schemas:
    Advocate:
      type: object
      required:
        - id
        - firstName
        - lastName
        - city
        - degree
        - specialties
        - yearsOfExperience
        - phoneNumber
      properties:
        id:
          type: integer
          format: int32
          description: Unique identifier for the advocate
        firstName:
          type: string
          description: First name of the advocate
        lastName:
          type: string
          description: Last name of the advocate
        city:
          type: string
          description: City where the advocate is located
        degree:
          type: string
          description: Academic degree of the advocate (e.g., MD, PhD, MSW)
        specialties:
          type: array
          items:
            type: string
          description: Areas of specialization for the advocate
        yearsOfExperience:
          type: integer
          description: Number of years of professional experience
        phoneNumber:
          type: integer
          format: int64
          description: Contact phone number
        createdAt:
          type: string
          format: date-time
          description: Timestamp when the advocate was added to the database
